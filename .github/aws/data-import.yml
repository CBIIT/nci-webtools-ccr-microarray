family: "${ECS_DATA_IMPORT_TASK}"
networkMode: awsvpc
cpu: "512"
memory: "1024"
executionRoleArn: "${ROLE_ARN}"
taskRoleArn: "${ROLE_ARN}"
requiresCompatibilities:
  - FARGATE
runtimePlatform:
  cpuArchitecture: X86_64
  operatingSystemFamily: LINUX
volumes:
  - name: data
    efsVolumeConfiguration:
      fileSystemId: "${EFS_FILESYSTEM_ID}"
      authorizationConfig:
        accessPointId: "${EFS_ACCESS_POINT_ID}"
        iam: ENABLED
      transitEncryption: ENABLED
containerDefinitions:
  - name: data-import
    image: public.ecr.aws/aws-cli/aws-cli:latest
    essential: true
    entryPoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws s3 sync "s3://${DATA_BUCKET}/microarray/data/" /data/data/
        && echo '--- /data/data after sync ---'
        && ls -la /data/data
    mountPoints:
      - sourceVolume: data
        containerPath: "/data"
        readOnly: false
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: "/analysistools/${TIER}/${APP}/data-import"
        awslogs-region: "${AWS_REGION}"
        awslogs-stream-prefix: data-import
        awslogs-create-group: "true"
tags:
  - key: Project
    value: "${APP}"
  - key: ApplicationName
    value: "${APP}"
  - key: ResourceName
    value: "${TIER}-${APP}-data-import-ecs-task"
  - key: EnvironmentTier
    value: "${TIER_UPPER}"
  - key: ResourceFunction
    value: compute
  - key: Creator
    value: CDK
