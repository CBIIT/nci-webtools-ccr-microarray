# =============================================================================
# MicroArray Deployment Workflow
# =============================================================================
#
# PURPOSE:
#   Deploys MicroArray frontend + backend Node.js application via SSH
#   Replicates Jenkins/Ansible deployment workflow
#
# PREREQUISITES:
#   - GitHub Environment secrets configured for each tier
#   - Servers with Node.js, R, and system dependencies installed
#   - Systemd services configured: microarray-web and microarray-processor
#   - SSH access configured on target servers
#
# REQUIRED GITHUB SECRETS (per environment):
#   - SSH_PRIVATE_KEY: SSH private key for server access
#   - DEPLOY_HOST: Server hostname or IP
#   - DEPLOY_USER: SSH username (e.g., ncianalysis)
#   - DEPLOY_PATH: Deployment directory (e.g., /local/content/microarray)
#   - CONFIG_PATH: Configuration directory (e.g., /local/content/microarray/config)
#
# OPTIONAL GITHUB SECRETS (per environment):
#   - WEB_SERVICE: Web service name (default: microarray-web)
#   - PROCESSOR_SERVICE: Processor service name (default: microarray-processor)
#
# =============================================================================

name: Deploy
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tier:
        description: "Deploy environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

permissions:
  contents: read

jobs:
  deploy-microarray-app:
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier || 'dev' }}
    env:
      APP: microarray
      TZ: America/New_York
      APP_PORT: 9220
      TIER: ${{ inputs.tier || 'dev' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      CONFIG_PATH: ${{ secrets.CONFIG_PATH }}
      WEB_SERVICE: ${{ secrets.WEB_SERVICE || 'microarray-web' }}
      PROCESSOR_SERVICE: ${{ secrets.PROCESSOR_SERVICE || 'microarray-processor' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set dynamic environment variables
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          VERSION=$(echo "$BRANCH_NAME" | awk -F'_' '{print $2}')
          DATE=$(echo "$BRANCH_NAME" | awk -F'_' '{print $3}')
          echo "VERSION=${VERSION:-$(date +%Y%m%d)}" >> $GITHUB_ENV
          echo "DATE=${DATE:-$(date +%Y-%m-%d)}" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "ENVIRONMENT_TIER=${TIER^^}" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 \
            ${DEPLOY_USER}@${DEPLOY_HOST} "echo 'SSH connection successful'"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          npm ci --only=production

      - name: Install frontend dependencies
        working-directory: ./client
        run: |
          npm ci

      - name: Build frontend
        working-directory: ./client
        run: |
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          
          # Copy backend files
          cp -r node_modules deploy/
          cp -r components deploy/
          cp -r service deploy/
          cp -r setup deploy/
          cp index.js routes.js package.json deploy/
          
          # Copy built frontend (rename to www as per Ansible deployment)
          cp -r client/build deploy/www
          
          # Create tarball
          tar -czf microarray-${TIMESTAMP}.tar.gz -C deploy .
          
          echo "Deployment package created: microarray-${TIMESTAMP}.tar.gz"
          ls -lh microarray-${TIMESTAMP}.tar.gz

      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH'
            BACKUP_DIR="${DEPLOY_PATH}/backups/${TIMESTAMP}"
            mkdir -p "$BACKUP_DIR"
            
            if [ -d "${DEPLOY_PATH}/app" ]; then
              echo "Creating backup at $BACKUP_DIR"
              cp -r ${DEPLOY_PATH}/app "$BACKUP_DIR/"
              echo "Backup completed"
              
              # Clean up old backups (keep last 7 days)
              find ${DEPLOY_PATH}/backups -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
            else
              echo "No existing deployment to backup"
            fi
          ENDSSH
        env:
          TIMESTAMP: ${{ env.TIMESTAMP }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}

      - name: Stop services
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH'
            echo "Stopping services..."
            sudo systemctl stop ${WEB_SERVICE} || echo "Web service not running"
            sudo systemctl stop ${PROCESSOR_SERVICE} || echo "Processor service not running"
            echo "Services stopped"
          ENDSSH
        env:
          WEB_SERVICE: ${{ env.WEB_SERVICE }}
          PROCESSOR_SERVICE: ${{ env.PROCESSOR_SERVICE }}

      - name: Upload deployment package
        run: |
          echo "Uploading deployment package..."
          scp -i ~/.ssh/deploy_key \
            microarray-${TIMESTAMP}.tar.gz \
            ${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH'
            set -e
            
            echo "Deploying application..."
            
            # Create deployment directory if it doesn't exist
            mkdir -p ${DEPLOY_PATH}/app
            
            # Extract deployment package
            cd ${DEPLOY_PATH}/app
            tar -xzf /tmp/microarray-${TIMESTAMP}.tar.gz
            
            # Copy configuration from config directory
            if [ -f "${CONFIG_PATH}/microarray_setting.json" ]; then
              mkdir -p config
              cp ${CONFIG_PATH}/microarray_setting.json ${DEPLOY_PATH}/app/config/
              echo "Configuration file copied"
            else
              echo "Warning: Configuration file not found at ${CONFIG_PATH}/microarray_setting.json"
            fi
            
            # Create necessary directories (matching Ansible deployment)
            mkdir -p data logs temp
            
            # Set permissions (matching Ansible deployment)
            sudo chown -R ${DEPLOY_USER}:apache ${DEPLOY_PATH}/app
            sudo chmod -R 755 ${DEPLOY_PATH}/app
            
            # Clean up
            rm -f /tmp/microarray-${TIMESTAMP}.tar.gz
            
            echo "Deployment completed"
          ENDSSH
        env:
          TIMESTAMP: ${{ env.TIMESTAMP }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          CONFIG_PATH: ${{ env.CONFIG_PATH }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}

      - name: Start services
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH'
            echo "Starting services..."
            sudo systemctl start ${WEB_SERVICE}
            sudo systemctl start ${PROCESSOR_SERVICE}
            
            # Wait for services to start
            sleep 5
            
            # Check service status
            sudo systemctl status ${WEB_SERVICE} --no-pager || true
            sudo systemctl status ${PROCESSOR_SERVICE} --no-pager || true
            
            echo "Services started"
          ENDSSH
        env:
          WEB_SERVICE: ${{ env.WEB_SERVICE }}
          PROCESSOR_SERVICE: ${{ env.PROCESSOR_SERVICE }}

      - name: Wait for application startup
        run: |
          echo "Waiting for application to start..."
          sleep 10

      - name: Health check - Web service
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH'
            echo "Performing health check..."
            
            # Check if web service is responding
            if curl -f -s http://localhost:${APP_PORT}/ping > /dev/null; then
              echo "✅ Web service health check passed"
            else
              echo "❌ Web service health check failed"
              echo "Checking service logs..."
              sudo journalctl -u ${WEB_SERVICE} -n 50 --no-pager
              exit 1
            fi
          ENDSSH
        env:
          APP_PORT: ${{ env.APP_PORT }}
          WEB_SERVICE: ${{ env.WEB_SERVICE }}

      - name: Health check - Processor service
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH'
            # Check if processor service is running
            if sudo systemctl is-active --quiet ${PROCESSOR_SERVICE}; then
              echo "✅ Processor service is running"
            else
              echo "❌ Processor service health check failed"
              echo "Checking service logs..."
              sudo journalctl -u ${PROCESSOR_SERVICE} -n 50 --no-pager
              exit 1
            fi
          ENDSSH
        env:
          PROCESSOR_SERVICE: ${{ env.PROCESSOR_SERVICE }}

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH'
            echo "=== Deployment Verification ==="
            echo "Services status:"
            sudo systemctl is-active ${WEB_SERVICE} && echo "  Web: ✅ Active" || echo "  Web: ❌ Inactive"
            sudo systemctl is-active ${PROCESSOR_SERVICE} && echo "  Processor: ✅ Active" || echo "  Processor: ❌ Inactive"
            
            echo ""
            echo "Application files:"
            ls -lh ${DEPLOY_PATH}/app/ | head -10
            
            echo ""
            echo "Recent logs (last 10 lines):"
            sudo journalctl -u ${WEB_SERVICE} -n 10 --no-pager | tail -5
          ENDSSH
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          WEB_SERVICE: ${{ env.WEB_SERVICE }}
          PROCESSOR_SERVICE: ${{ env.PROCESSOR_SERVICE }}

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo ""
          echo "Environment: ${ENVIRONMENT_TIER}"
          echo "Version: ${VERSION}"
          echo "Date: ${DATE}"
          echo "Timestamp: ${TIMESTAMP}"
          echo "Host: ${DEPLOY_HOST}"
          echo ""
          echo "Services:"
          echo "  - Web: ${WEB_SERVICE}"
          echo "  - Processor: ${PROCESSOR_SERVICE}"
          echo ""
          echo "Application URL: http://${DEPLOY_HOST}:${APP_PORT}"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Attempting rollback..."
          
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} << 'ENDSSH' || true
            
            # Find latest backup
            LATEST_BACKUP=$(ls -td ${DEPLOY_PATH}/backups/*/ 2>/dev/null | head -1)
            
            if [ -n "$LATEST_BACKUP" ] && [ -d "$LATEST_BACKUP" ]; then
              echo "Rolling back to: $LATEST_BACKUP"
              
              # Stop services
              sudo systemctl stop ${WEB_SERVICE} ${PROCESSOR_SERVICE} || true
              
              # Restore backup
              rm -rf ${DEPLOY_PATH}/app
              cp -r ${LATEST_BACKUP}/app ${DEPLOY_PATH}/
              
              # Restart services
              sudo systemctl start ${WEB_SERVICE}
              sudo systemctl start ${PROCESSOR_SERVICE}
              
              echo "Rollback completed"
            else
              echo "No backup found for rollback"
            fi
          ENDSSH
          
          rm -f ~/.ssh/deploy_key || true
          exit 1
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          WEB_SERVICE: ${{ env.WEB_SERVICE }}
          PROCESSOR_SERVICE: ${{ env.PROCESSOR_SERVICE }}
