services:
  backend:
    build:
      context: "."
      dockerfile: "./docker/backend.dockerfile"
    env_file: .env
    volumes:
      - ./data:/data
      - ./log:/log
      - ./tmp:/tmp
    ports:
      - "9220:9220"

  frontend:
    build:
      context: "."
      dockerfile: "./docker/frontend.dockerfile"
    ports:
      - "3000:3000"
    depends_on:
      - backend
