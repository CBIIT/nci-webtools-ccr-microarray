Listen 3000

<VirtualHost *:3000>
    DocumentRoot "/var/www/html"

    # Proxy API requests to backend
    ProxyPass "/api" "http://backend:9220/api" retry=1 timeout=300 keepalive=On
    ProxyPassReverse "/api" "http://backend:9220/api"

    # Proxy ping endpoint
    ProxyPass "/ping" "http://backend:9220/ping" retry=1
    ProxyPassReverse "/ping" "http://backend:9220/ping"

    # Proxy uploaded images
    ProxyPass "/images" "http://backend:9220/images" retry=1
    ProxyPassReverse "/images" "http://backend:9220/images"

    # Serve React app — fallback to index.html for client-side routing
    <Directory "/var/www/html">
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ServerTokens Prod
    ServerSignature Off
</VirtualHost>
